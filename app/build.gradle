plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace 'com.theseuntaylor.picsomeapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.theseuntaylor.picsomeapp"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Each E2E test starts from a fresh install state; screenshots go to test storage.
        testInstrumentationRunnerArguments clearPackageData: 'true', useTestStorageService: 'true'
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '2.0.21'
    }
    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation platform(libs.androidx.compose.bom)
    androidTestImplementation platform(libs.androidx.compose.bom)

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.runtime
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.savedstate
    implementation libs.androidx.material3
    implementation libs.androidx.navigation.compose
    implementation libs.kotlinx.coroutines.core
    implementation libs.androidx.room.common
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    implementation libs.androidx.hilt.work
    implementation libs.androidx.work.runtime.ktx
    implementation libs.androidx.hilt.navigation.compose
    implementation libs.androidx.activity.ktx
    implementation platform(libs.androidx.compose.bom)
    implementation libs.coil.compose
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp
    implementation libs.logging.interceptor

    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest

    // Hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    androidTestImplementation libs.hilt.android.testing
    kspAndroidTest libs.hilt.compiler
    testImplementation libs.hilt.android.testing
    kspTest libs.hilt.compiler
    implementation libs.androidx.hilt.work
    ksp libs.androidx.hilt.compiler

    testImplementation libs.junit
    testImplementation libs.junitparams
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.mockito.kotlin
    testImplementation libs.turbine

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.services.storage
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    androidTestUtil libs.androidx.test.orchestrator
    androidTestUtil libs.androidx.test.services
}
